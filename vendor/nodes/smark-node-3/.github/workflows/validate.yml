name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate skills, references, evals, and packs
        run: ./scripts/validate-skills.sh
      - name: Build skill zips and packs (must succeed)
        run: ./scripts/build-packs.sh
